<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register — E-Store</title>
</head>
<body style="margin:0;padding:0;min-height:100vh;background:linear-gradient(180deg,#071024,#0f172a);color:#fff;font-family:Inter,system-ui,Arial;display:flex;align-items:center;">
    <div style="max-width:900px;margin:40px auto;padding:18px;width:100%;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
            <a href="index.html" style="color:#fff;text-decoration:none;font-weight:700;">E-Store</a>
            <nav>
                <a href="ViewProd.jsp" style="color:rgba(255,255,255,0.9);text-decoration:none;margin-left:14px;">Products</a>
            </nav>
        </div>
        <div style="background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:28px;border-radius:12px;margin:0 auto;max-width:520px;">
            <div style="background:#fff;padding:22px;border-radius:10px;color:#0f172a;">
                <h2>Create Account</h2>
                <p style="color:#6b7280;margin-bottom:12px;">Register to access the Online Electronics Store</p>
                <form action="reg" method="post">
                    <label style="display:block;margin:10px 0 6px;font-weight:700;">User Name</label>
                    <input type="text" name="usname" placeholder="Enter Username" required style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;">
                    <label style="display:block;margin:10px 0 6px;font-weight:700;">Password</label>
                    <input type="password" name="pwd" placeholder="Enter Password" required style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;">
                    <label style="display:block;margin:10px 0 6px;font-weight:700;">First Name</label>
                    <input type="text" name="fname" placeholder="Enter First Name" required style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;">
                    <label style="display:block;margin:10px 0 6px;font-weight:700;">Last Name</label>
                    <input type="text" name="lname" placeholder="Enter Last Name" required style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;">
                    <label style="display:block;margin:10px 0 6px;font-weight:700;">Address</label>
                    <input type="text" name="add" placeholder="Enter Address" required style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;">
                    <label style="display:block;margin:10px 0 6px;font-weight:700;">Email ID</label>
                    <input type="text" name="mid" placeholder="Enter Email Address" required style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;">
                    <label style="display:block;margin:10px 0 6px;font-weight:700;">Mobile Number</label>
                    <input type="text" name="mobile" placeholder="Enter Mobile Number" required style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;">
                    <input type="submit" value="Register" style="margin-top:14px;width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:800;">
                </form>
                <div style="margin-top:12px;text-align:center;">
                    <a href="Customerlogin.html" style="color:#2563eb;text-decoration:none;display:block;margin:8px 0;">Already have an account? Login</a>
                    <a href="index.html" style="color:#2563eb;text-decoration:none;display:block;margin:8px 0;">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>
    <footer style="max-width:900px;margin:20px auto;color:rgba(255,255,255,0.6);text-align:center;">© 2026 E-Store</footer>
</body>
</html>
