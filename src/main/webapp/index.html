<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Electronics Store</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0F172A;
}

/* Navigation Bar */

nav{
    width:100%;
    height:70px;
    background:#111827;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 60px;
    box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.logo{
    color:#3B82F6;
    font-size:28px;
    font-weight:bold;
}

.menu a{
    text-decoration:none;
    color:white;
    margin-left:30px;
    font-size:17px;
    transition:.3s;
}

.menu a:hover{
    color:#3B82F6;
}

/* Main */

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    height:calc(100vh - 70px);
}

.card{
    background:#111827;
    width:400px;
    padding:40px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

.card h1{
    color:white;
    margin-bottom:40px;
}

.btn{
    display:block;
    width:100%;
    padding:15px;
    margin:15px 0;
    text-decoration:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
}

.customer{
    background:#2563EB;
    color:white;
}

.customer:hover{
    background:#1D4ED8;
}

.admin{
    background:white;
    color:#111827;
}

.admin:hover{
    background:#E5E7EB;
}

.footer{
    margin-top:30px;
    color:#9CA3AF;
    font-size:14px;
}

</style>

</head>

<body>

<nav>

    <div class="logo">
        E-Store
    </div>

    <div class="menu">
        <a href="index.html">Home</a>
        <a href="Customerlogin.html">Customer Login</a>
        <a href="adminlogin.html">Admin Login</a>
    </div>

</nav>

<div class="container">

    <div class="card">

        <h1>ONLINE ELECTRONICS STORE</h1>

        <a href="Customerlogin.html" class="btn customer">
            Customer Login
        </a>

        <a href="adminlogin.html" class="btn admin">
            Admin Login
        </a>

        <div class="footer">
            © 2026 Online Electronics Store
        </div>

    </div>

</div>

</body>
</html>
