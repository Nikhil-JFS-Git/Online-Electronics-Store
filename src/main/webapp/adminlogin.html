<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
</head>

<body style="margin:0;font-family:Arial,Helvetica,sans-serif;background:#0F172A;">

<!-- Navigation Bar -->

<div style="height:70px;background:#111827;display:flex;justify-content:space-between;align-items:center;padding:0 60px;">

    <div style="color:#3B82F6;font-size:28px;font-weight:bold;">
        E-Store
    </div>

    <div>

        <a href="index.html" style="color:white;text-decoration:none;margin-left:30px;">Home</a>

        <a href="Customerlogin.html" style="color:white;text-decoration:none;margin-left:30px;">Customer Login</a>

        <a href="adminlogin.html" style="color:#3B82F6;text-decoration:none;margin-left:30px;">Admin Login</a>

    </div>

</div>

<!-- Login Card -->

<div style="display:flex;justify-content:center;align-items:center;height:calc(100vh - 70px);">

<div style="width:380px;background:white;padding:35px;border-radius:12px;box-shadow:0 0 20px rgba(0,0,0,.4);">

<h2 style="text-align:center;color:#111827;margin-bottom:8px;">
Admin Login
</h2>

<p style="text-align:center;color:gray;margin-bottom:25px;">
Login to continue
</p>

<form action="Login" method="post">

<label style="font-weight:bold;">
Username
</label>

<input type="text"
name="uname"
required
placeholder="Enter Username"

style="width:100%;
padding:12px;
margin-top:8px;
margin-bottom:18px;
border:1px solid #ccc;
border-radius:8px;">


<label style="font-weight:bold;">
Password
</label>

<input type="password"
name="upwd"
required
placeholder="Enter Password"

style="width:100%;
padding:12px;
margin-top:8px;
margin-bottom:25px;
border:1px solid #ccc;
border-radius:8px;">


<input type="submit"
value="Login"

style="width:100%;
padding:13px;
background:#2563EB;
color:white;
font-size:17px;
font-weight:bold;
border:none;
border-radius:8px;
cursor:pointer;">

</form>

<a href="index.html"

style="display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
color:#2563EB;
font-weight:bold;">

← Back to Home

</a>

</div>

</div>

</body>
</html>
